<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- title -->
<title>for keeping - comfort</title>

<!-- Link to CSS -->
<link rel="stylesheet" href="css/style.css" />

<!-- JAVASCRIPT FOR HAMBURGER MENU -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var hamburger = document.querySelector('.mobile-menu');
    hamburger.addEventListener('click', toggleShow);
  });

  function toggleShow() {
    var menu = document.getElementById('menu');
    menu.classList.toggle('show');
  }
</script>
  </head>

  <body>
<header>
  <!-- Website title links back to the homepage -->
  <h1><a href="index.html">for &mdash; keeping</a></h1>

  <!-- Hamburger menu for tablet/mobile -->
  <span class="mobile-menu">&#8801;</span>

  <nav>
    <ul id="menu">
      <li><a href="comfort.html" class="active">comfort</a></li>
      <li><a href="wonder.html">wonder</a></li>
      <li><a href="connection.html">connection</a></li>
    </ul>
  </nav>
</header>

<main>
  <!-- Page heading -->
  <h3>✦ ˑ ִֶָ 𓂃⊹ a sense of home ✦ ˑ ִֶָ 𓂃⊹</h3>

  <!-- fluffys -->
  <div class="memory pos-1">
    <div class="memory-photos">
      <img src="./img/comfort/fluffys.JPG" alt="fluffy's ice cream shop interior" />
      <video autoplay muted loop playsinline>
        <source src="./img/comfort/fluffys.mp4" type="video/mp4">
      </video>
    </div>
    <p class="memory-caption">
      <span class="memory-title">Fluffy McCloud's</span>
      Our go-to banana split.
    </p>
  </div>

  <!-- different seasons -->
  <div class="memory pos-2">
    <div class="memory-photos">
      <img src="./img/comfort/autumnNeighbors.jpg" alt="Neighbors in autumn" />
      <img src="./img/comfort/springNeighbors.JPG" alt="Neighbors in spring" />
      <img src="./img/comfort/summerNeighbors.jpg" alt="Neighbors in summer" />
      <img src="./img/comfort/sunriseNeighbors.JPG" alt="Neighbors at sunrise" />
    </div>
    <p class="memory-caption">
      <span class="memory-title">My Bedroom Window</span>
      My view of my neighbor's house throughout the different seasons.
    </p>
  </div>

  <!-- window dress -->
  <div class="memory pos-3">
    <div class="memory-photos">
      <img src="./img/comfort/summerNeighborsWindow.JPG" alt="A dress in the window" />
      <img src="./img/comfort/summerNeighborsWindowClose.JPG" alt="Window dress, closer up" />
    </div>
    <p class="memory-caption">
      <span class="memory-title">Red Dress</span>
      A red dress hanging to dry in my neighbor's window.
    </p>
  </div>

  <!-- Additional memories can go here: copy a .memory block and give it a new pos- class -->
</main>
  </body>
</html>
