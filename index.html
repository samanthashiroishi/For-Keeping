<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title -->
    <title>for keeping</title>

    <!-- Link to CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- JAVASCRIPT FOR HAMBURGER MENU -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var hamburger = document.querySelector('.mobile-menu');
        hamburger.addEventListener('click', toggleShow);
      });

      function toggleShow() {
        var menu = document.getElementById('menu');
        menu.classList.toggle('show');
      }
    </script>
  </head>

  <!-- class="home" identifies the homepage -->
  <body class="home">

    <!-- header wraps the title, hamburger, and nav -->
    <header>

      <h1><a href="index.html">for &mdash; keeping</a></h1>

      <!-- hamburger menu should only show up on iPad and mobile -->
      <span class="mobile-menu">&#8801;</span>

      <nav>
        <!-- id="menu" so that JS can find the menu and add/remove "show" -->
        <ul id="menu">
          <li><a href="comfort.html">comfort</a></li>
          <li><a href="wonder.html">wonder</a></li>
          <li><a href="savor.html">savor</a></li>
        </ul>
      </nav>

    </header>

    <!-- container for the sketch and frame (desktop and iPad only) -->
    <div class="sketch-frame">

      <!-- p5.js sketch -->
      <iframe
        src="https://editor.p5js.org/seumantha/full/aXBNWXtNt"
        width="1000"
        height="800"
        frameborder="0"
        scrolling="no">
      </iframe>

      <!-- picture frame overlay -->
      <img
        src="img/frame.png"
        alt="silver frame"
        class="frame-overlay"
      >

    </div>

    <!-- framed homepage image (mobile only) -->
    <div class="mobile-home-frame">

      <!-- homepage image -->
      <img src="img/mobileHomePageImage.jpg" alt="for keeping - home page" class="homepage-img" />

      <!-- gold frame layered over the homepage image -->
      <img
        src="img/frame.png"
        alt=""
        class="mobile-frame-overlay"/>
    </div>

   <div class="frame-caption">
   <p>
      <span>For Keeping &mdash; Fall 2026</span>
      <span class="desktopTablet" ><em>Click inside the frame to reveal memories.</em> </span>
      <span class="mobile" ><em>Image: Fluffy McCloud's banana split.</em></span>
   </p>
</div>

  </body>
</html>
